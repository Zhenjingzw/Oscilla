:root, [data-theme="dark"] {
  --bg-start: #0d0d0d; --bg-end: #050505;
  --surface: rgba(20, 20, 22, 0.78); --surface-hover: rgba(26, 26, 28, 0.9);
  --text: #dce0e8; --text-dim: #5a5f6a;
  --accent: #e8eaf0; --accent-light: #f0f2f5;
  --accent-glow: rgba(232, 234, 240, 0.25); --accent-ring: rgba(232, 234, 240, 0.05);
  --accent2: #6e737d; --accent2-glow: rgba(110, 115, 125, 0.22); --accent3: #32353c;
  --rod: rgba(200, 205, 215, 0.35); --weight: #e0e0e8; --weight-glow: rgba(224, 224, 232, 0.45);
  --pivot: rgba(170, 175, 185, 0.45); --border: rgba(60, 64, 70, 0.5);
  --noise-opacity: 0.028; --btn-text: #fff;
}
[data-theme="light"] {
  --bg-start: #faf8f5; --bg-end: #efe9e0;
  --surface: rgba(255, 255, 255, 0.72); --surface-hover: rgba(250, 248, 245, 0.9);
  --text: #1a1a1a; --text-dim: #8c8c8c;
  --accent: #b5343a; --accent-light: #d4605a;
  --accent-glow: rgba(181, 52, 58, 0.28); --accent-ring: rgba(181, 52, 58, 0.08);
  --accent2: #d4a05a; --accent2-glow: rgba(212, 160, 90, 0.25); --accent3: #b0b0b0;
  --rod: rgba(30, 30, 30, 0.4); --weight: #b5343a; --weight-glow: rgba(181, 52, 58, 0.6);
  --pivot: rgba(60, 60, 60, 0.45); --border: rgba(0, 0, 0, 0.07);
  --noise-opacity: 0.025; --btn-text: #fff;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;
  background:radial-gradient(ellipse at 50% 28%,var(--bg-start) 0%,var(--bg-end) 100%);
  color:var(--text);transition:background .7s,color .55s;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
}
body::after{
  content:"";position:fixed;inset:0;opacity:var(--noise-opacity);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat:repeat;pointer-events:none;z-index:0;transition:opacity .5s;
}
.container{position:relative;z-index:1;width:100%;max-width:440px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:18px;justify-content:center}
.header{width:100%;padding:0 4px;text-align:center}

.title{font-family:"Fira Code Embedded","SF Mono","Cascadia Code","Consolas","Menlo",monospace;font-size:1.7rem;font-weight:300;letter-spacing:.55em;margin-right:-.55em;color:var(--text);opacity:.82;display:inline-block;width:100%;text-align:center}
.title-o{display:inline-block;width:20px;height:20px;border-radius:50%;transform:translateZ(0);border:2.2px solid var(--text);cursor:pointer;transition:border-color .35s,box-shadow .35s,background .35s;vertical-align:middle;margin-right:.65em;position:relative;top:-1.5px;left:1.5px}[data-theme="dark"] .title-o{background:var(--text)}[data-theme="light"] .title-o{background:transparent}@media(hover:hover){.title-o:hover{box-shadow:0 0 14px var(--accent-glow);border-color:var(--accent)}}
.canvas-wrap{width:100%;aspect-ratio:1/1;max-width:420px;position:relative}
canvas{width:100%;height:100%;border-radius:22px;display:block;cursor:default;touch-action:none}
canvas.grabbing{cursor:ns-resizebing}
canvas.grab-hint{cursor:ns-resize}
.bpm-section{display:flex;flex-direction:column;align-items:center;gap:1px}
.bpm-value{font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;
  font-size:4.5rem;font-weight:100;touch-action:manipulation;letter-spacing:-.04em;line-height:1;
  color:var(--text);font-variant-numeric:tabular-nums;transition:color .55s,transform .2s;
  cursor:pointer;
}

@media(hover:hover){.bpm-value:hover{transform:translateY(-2px)}}

/* Inline TS stepper */
.ts-row{display:flex;align-items:center;gap:6px}
.ts-num{font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;font-size:1.05rem;touch-action:manipulation;font-weight:300;color:var(--text);padding:4px 8px;border-radius:8px;transition:all .2s;font-variant-numeric:tabular-nums}
.ts-num .lz{opacity:0;transition:opacity .15s}
.ts-num .lz.visible{opacity:1}
@media(hover:hover){.ts-num:hover{transform:translateY(-2px)}}

.ts-num.locked{opacity:.35;cursor:not-allowed;pointer-events:none}



.ts-sep{font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;font-size:1rem;color:var(--text-dim);font-weight:300}

.accent-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:232px;margin:-35px auto 2px;min-height:52px;align-content:flex-start}
.accent-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);cursor:pointer;transition:all .2s;position:relative}
@media(hover:hover){.accent-dot:hover{transform:scale(1.2);border-color:var(--text-dim)}}
.accent-dot:active{transform:scale(.85)}
.accent-strong{background:var(--accent);border-color:var(--accent)}
.accent-secondary{background:var(--accent2);border-color:var(--accent2)}
.accent-weak{background:transparent;border-color:var(--text-dim)}
.accent-dot.beat-active{transform:scale(1.35);animation:dotPop .22s ease-out}
@keyframes dotPop{0%{transform:scale(1.6)}100%{transform:scale(1.0)}}

@media(max-width:500px){
  .container{padding:12px;gap:14px}
  .bpm-value{font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;font-size:3.5rem}
  .canvas-wrap{max-width:100%}
  .accent-dot{width:20px;height:20px}

}

.title-dir{transition:color .35s;display:inline-block;transform:translateZ(0)}
[data-theme="dark"] .title-i{color:var(--text-dim)}[data-theme="dark"] .title-a{color:var(--accent)}
[data-theme="dark"] .dir-right .title-i{color:var(--accent)}[data-theme="dark"] .dir-right .title-a{color:var(--text-dim)}
[data-theme="light"] .title-i{color:var(--accent2)}[data-theme="light"] .title-a{color:var(--accent)}
[data-theme="light"] .dir-right .title-i{color:var(--accent)}[data-theme="light"] .dir-right .title-a{color:var(--accent2)}

.panel{background:var(--surface);border-radius:28px;border:2px solid var(--border);padding:28px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 4px 40px rgba(0,0,0,.35);transition:background .7s,border-color .55s;width:100%}</style>
</head>

  </div>
</div>
</div>

var trail=[],MAX_TRAIL=26;

var pivotCanvasX=0,pivotCanvasY=0,rodLenGlobal=0;
var mouseCanvasX=-100,mouseCanvasY=-100;

// ===== AUDIO =====
var audioCtx=null;
function initAudio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)()}if(audioCtx.state==="suspended")audioCtx.resume()}
function scheduleClick(level,time){
  if(!audioCtx)return;
  var osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  var freq,vol,dur;
  if(level===2){freq=700;vol=.7;dur=.09}
  else if(level===1){freq=950;vol=.45;dur=.065}
  else{freq=1300;vol=.28;dur=.045}
  osc.type="sine";osc.frequency.setValueAtTime(2200,time);
  osc.frequency.exponentialRampToValueAtTime(freq,time+.004);
  gain.gain.setValueAtTime(vol,time);
  gain.gain.exponentialRampToValueAtTime(.001,time+dur);
  osc.start(time);osc.stop(time+dur+.01);
}

// ===== SCHEDULER =====
var nextBeatTime=0,beatInterval=.5,schedulerRAF=null,scheduleBeatIndex=0;
function calcBeatInterval(){return 60/state.bpm}
function scheduleBeats(){
  if(!state.playing)return;
  var now=audioCtx?audioCtx.currentTime:performance.now()/1000;
  while(nextBeatTime<now+.15){
    var idx=scheduleBeatIndex%state.beatsPerMeasure;
    scheduleClick(state.accentPattern[idx],nextBeatTime);
    scheduleBeatIndex++;nextBeatTime+=beatInterval;
  }
  schedulerRAF=requestAnimationFrame(scheduleBeats);
}
function startPlayback(){
  if(state.playing)return;
  initAudio();if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();
  state.playing=true;state.lastFlashBeat=-1;state.lastRawBeat=-1;state.angle=state.swingDirection*.01;
  beatInterval=calcBeatInterval();
  var now=audioCtx?audioCtx.currentTime:performance.now()/1000;
  var cosVal=Math.abs(state.angle)/MAX_ANGLE;
  if(cosVal>1)cosVal=1;if(cosVal<-1)cosVal=-1;
  var phaseNow=Math.acos(cosVal)/Math.PI;
  state.firstBeatTime=now-phaseNow*beatInterval;
  var nextHalfPhase=Math.ceil(phaseNow-0.5)+0.5;
  nextBeatTime=state.firstBeatTime+nextHalfPhase*beatInterval;
  if(nextBeatTime<=now+.005)nextBeatTime=now+.008;
  scheduleBeatIndex=Math.floor(nextHalfPhase)%state.beatsPerMeasure;
  state.currentBeat=(scheduleBeatIndex-1+state.beatsPerMeasure)%state.beatsPerMeasure;
  updateTsLock();scheduleBeats();
}
function stopPlayback(){
  state.playing=false;
  if(schedulerRAF){cancelAnimationFrame(schedulerRAF);schedulerRAF=null}
  if(audioCtx&&audioCtx.state==="running")audioCtx.suspend();
  clearBeatHighlights();updateTsLock();
}

// ===== GEOMETRY =====
var MAX_ANGLE=32*Math.PI/180;
function getCanvasGeom(){var w=canvas.clientWidth,h=canvas.clientHeight;return{w:w,h:h,cx:w/2,pivotY:h*.22,rodLen:h*.56}}
function getCSS(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

// ===== RESIZE =====
function resizeCanvas(){
  var size=canvas.parentElement.clientWidth,dpr=window.devicePixelRatio||1;
  canvas.width=size*dpr;canvas.height=size*dpr;
  canvas.style.width=size+"px";canvas.style.height=size+"px";
  pivotCanvasX=size/2;pivotCanvasY=size*.22;rodLenGlobal=size*.56;
  var t0=(state.bpm-20)/(300-20);
  state.weightCurrentY=pivotCanvasY+rodLenGlobal*(.18+(1-t0)*.72);
  state.weightTargetY=state.weightCurrentY;
}

// ===== DRAW =====
var animRAF=null;
function drawPendulum(ts){
  var g=getCanvasGeom(),w=g.w,h=g.h,cx=g.cx,pivotY=g.pivotY,rodLen=g.rodLen;
  rodLenGlobal=rodLen;pivotCanvasX=cx;pivotCanvasY=pivotY;
  var dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);

  var rodColor=getCSS("--rod"),weightColor=getCSS("--weight"),textColor=getCSS("--text");
  var weightGlow=getCSS("--weight-glow"),pivotColor=getCSS("--pivot");
  var accentG=getCSS("--accent-glow");

  // Angle: zero during drag, swing during play, decay when idle
  if(state.dragging){state.angle=0}
  else if(state.playing){
    var now=audioCtx?audioCtx.currentTime:performance.now()/1000;
    var elapsed=now-state.firstBeatTime;if(elapsed<0)elapsed=0;
    state.angle=state.swingDirection*Math.cos(elapsed/beatInterval*Math.PI)*MAX_ANGLE;
  }else{state.angle*=.88;if(Math.abs(state.angle)<.0005)state.angle=0}

  if(!state.dragging){var t0=(state.bpm-20)/(300-20);state.weightTargetY=pivotY+rodLen*(.18+(1-t0)*.72)}
  state.weightCurrentY+=(state.weightTargetY-state.weightCurrentY)*.08;
  var weightY=state.weightCurrentY;

  var tipX=cx+Math.sin(state.angle)*rodLen,tipY=pivotY+Math.cos(state.angle)*rodLen;
  var wFr=(weightY-pivotY)/rodLen;
  var weightX=cx+Math.sin(state.angle)*rodLen*wFr,wY=pivotY+Math.cos(state.angle)*rodLen*wFr;
  weightCanvasX=weightX;weightCanvasY=wY;

  // Trail
  if(state.playing){trail.push({x:weightX,y:wY});if(trail.length>MAX_TRAIL)trail.shift()}
  else if(trail.length>0)trail.shift();
  for(var i=0;i<trail.length;i++){var t=i/trail.length;ctx.globalAlpha=Math.pow(t,2)*.6;if(state.theme==="dark"){var rc=["#ea80fc","#7c4dff","#448aff","#ffab40","#ff7043","#ff5252"];var ci=Math.floor(t*(rc.length-1));ctx.fillStyle=rc[ci]}else{ctx.fillStyle=weightColor}ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,1+Math.pow(t,.55)*3.5,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;


  // Pivot dot
  ctx.fillStyle=textColor;ctx.beginPath();ctx.arc(cx,pivotY,2.8,0,Math.PI*2);ctx.fill();

    // Rod (split at weight ring)
  var wR=state.dragging?5.2:4.5;
  var rdTopX=weightX-Math.sin(state.angle)*wR, rdTopY=wY-Math.cos(state.angle)*wR;
  var rdBotX=weightX+Math.sin(state.angle)*wR, rdBotY=wY+Math.cos(state.angle)*wR;
  ctx.save();ctx.shadowColor=textColor;ctx.shadowBlur=3;
  ctx.strokeStyle=textColor;ctx.lineWidth=.3;
  ctx.beginPath();ctx.moveTo(cx,pivotY);ctx.lineTo(rdTopX,rdTopY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(rdBotX,rdBotY);ctx.lineTo(tipX,tipY);ctx.stroke();
  ctx.restore();

  // Weight (hollow ring; fills when dragging)
  if(state.dragging){
    ctx.save();ctx.shadowColor=weightGlow;ctx.shadowBlur=10;
    ctx.fillStyle=weightColor;ctx.beginPath();ctx.arc(weightX,wY,wR,0,Math.PI*2);ctx.fill();ctx.restore();
  }else{
    ctx.strokeStyle=weightColor;ctx.lineWidth=1.6;
    ctx.beginPath();ctx.arc(weightX,wY,wR,0,Math.PI*2);ctx.stroke();
  }

  // Flash
  if(state.beatFlash>.01||state.lastBeatTime>0){var bt=state.accentPattern[state.currentBeat]||0;var rx=cx,ry=weightY;var elapsed=(performance.now()/1000)-state.lastBeatTime;if(elapsed<.3&&(bt===2||bt===1)){var t=elapsed/(bt===2?.4:.3);var rad=(bt===2?80:50)*t;var alpha=(1-t)*(bt===2?.75:.6);var ringColor=state.theme==="dark"?"#e8eaf0":(bt===2?"#b5343a":"#d4a05a");ctx.globalAlpha=alpha;ctx.strokeStyle=ringColor;ctx.lineWidth=bt===2?2:1.5;ctx.beginPath();ctx.arc(rx,ry,rad,0,Math.PI*2);ctx.stroke()}if(elapsed>=.3)state.lastBeatTime=0;ctx.globalAlpha=1;state.beatFlash*=.84}

  // Pivot (double ring node)
  ctx.fillStyle=getCSS("--accent");ctx.beginPath();ctx.arc(cx,pivotY,3.5,0,Math.PI*2);ctx.fill();
  animRAF=requestAnimationFrame(drawPendulum);
}

// ===== POINTER =====
function canvasPos(e){var r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function distToWeight(mx,my){var dx=mx-weightCanvasX,dy=my-weightCanvasY;return Math.sqrt(dx*dx+dy*dy)}
function distToPivot(mx,my){var dx=mx-pivotCanvasX,dy=my-pivotCanvasY;return Math.sqrt(dx*dx+dy*dy)}

function onPointerDown(e){
  e.preventDefault();var pos=canvasPos(e.touches?e.touches[0]:e);
  if(distToPivot(pos.x,pos.y)<22&&state.playing){stopPlayback();return}
  if(distToWeight(pos.x,pos.y)<38){if(state.playing)return;state.dragging=true;state.angle=0;canvas.classList.add("grabbing");canvas.classList.remove("grab-hint")}
}
function onPointerMove(e){
  e.preventDefault();var pos=canvasPos(e.touches?e.touches[0]:e);
  mouseCanvasX=pos.x;mouseCanvasY=pos.y;
  if(state.dragging){
    var g=getCanvasGeom(),frac=(pos.y-g.pivotY)/g.rodLen;
    frac=Math.max(.18,Math.min(.9,frac));
    state.weightTargetY=g.pivotY+g.rodLen*frac;
    state.weightCurrentY+=(state.weightTargetY-state.weightCurrentY)*.18;
    var pBpm=Math.round(300-(frac-.18)/.72*280);
    pBpm=Math.max(20, Math.min(300,pBpm));
    bpmValue.textContent=pBpm;bpmValue.classList.add("preview");
  }else if(!state.playing){canvas.classList.toggle("grab-hint",distToWeight(pos.x,pos.y)<38)}
}
function onPointerUp(){
  if(!state.dragging)return;
  state.dragging=false;canvas.classList.remove("grabbing","grab-hint");bpmValue.classList.remove("preview");
  var g=getCanvasGeom(),frac=(state.weightCurrentY-g.pivotY)/g.rodLen;
  frac=Math.max(.18,Math.min(.9,frac));
  state.bpm=Math.round(300-(frac-.18)/.72*280);
  state.bpm=Math.max(20, Math.min(300,state.bpm));
  bpmValue.textContent=state.bpm;beatInterval=calcBeatInterval();
}

// ===== ACCENT =====
function renderAccentDots(){
  accentDotsContainer.innerHTML="";
  for(var i=0;i<state.beatsPerMeasure;i++){
    var dot=document.createElement("div");dot.className="accent-dot";
    if(state.accentPattern[i]===2)dot.classList.add("accent-strong");
    else if(state.accentPattern[i]===1)dot.classList.add("accent-secondary");
    else dot.classList.add("accent-weak");
    dot.setAttribute("data-idx",i);
    dot.addEventListener("click",function(){var idx=parseInt(this.getAttribute("data-idx"));state.accentPattern[idx]=(state.accentPattern[idx]+1)%3;renderAccentDots();highlightCurrentBeat()});
    accentDotsContainer.appendChild(dot);
  }
}
function highlightCurrentBeat(){var dots=accentDotsContainer.querySelectorAll(".accent-dot");for(var i=0;i<dots.length;i++)dots[i].classList.toggle("beat-active",i===state.currentBeat&&state.playing)}
function clearBeatHighlights(){var dots=accentDotsContainer.querySelectorAll(".accent-dot");for(var i=0;i<dots.length;i++)dots[i].classList.remove("beat-active")}

// ===== TS STEPPER =====

// ===== TS DRAG =====
var tsDragY=0,tsDragTarget=null,tsTapTarget=null;
function tsDragStart(e,target){if(state.playing)return;
  tsDragY=e.touches?e.touches[0].clientY:e.clientY;
  tsDragTarget=target;tsTapTarget=target;e.preventDefault();e.stopPropagation();
}
window.addEventListener("mousemove",function(e){
  if(!tsDragTarget)return;
  var sens=isMobile?.08:.15;var d=Math.round((tsDragY-e.clientY)*sens);
  if(d===0)return;tsTapTarget=null;
  var tsTy=Math.max(-6,Math.min(6,-(tsDragY-e.clientY)*0.3));tsDragTarget.style.transform="translateY("+tsTy+"px)";tsDragY=e.clientY;
  if(tsDragTarget===tsNumBtn)changeNum(d>0?1:-1);
  else changeDen(d>0?1:-1);
});
window.addEventListener("touchmove",function(e){
  if(!tsDragTarget)return;
  var sens=isMobile?.08:.15;var d=Math.round((tsDragY-e.touches[0].clientY)*sens);
  if(d===0)return;tsTapTarget=null;
  var tsTy=Math.max(-6,Math.min(6,-(tsDragY-e.touches[0].clientY)*0.3));tsDragTarget.style.transform="translateY("+tsTy+"px)";tsDragY=e.touches[0].clientY;
  if(tsDragTarget===tsNumBtn)changeNum(d>0?1:-1);
  else changeDen(d>0?1:-1);
});
window.addEventListener("mouseup",function(){if(tsDragTarget){tsDragTarget.style.transform=""}tsDragTarget=null;tsTapTarget=null});
window.addEventListener("touchend",function(){if(tsTapTarget&&isMobile&&!state.playing){if(tsTapTarget===tsNumBtn)changeNum(1);else changeDen(1)}if(tsDragTarget){tsDragTarget.style.transform=""}tsDragTarget=null;tsTapTarget=null});
tsNumBtn.addEventListener("mousedown",function(e){tsDragStart(e,tsNumBtn)});
tsDenBtn.addEventListener("mousedown",function(e){tsDragStart(e,tsDenBtn)});
tsNumBtn.addEventListener("touchstart",function(e){tsDragStart(e,tsNumBtn)},{passive:false});
tsDenBtn.addEventListener("touchstart",function(e){tsDragStart(e,tsDenBtn)},{passive:false});

function updateTsLock(){if(state.playing){tsNumBtn.classList.add("locked");tsDenBtn.classList.add("locked")}else{tsNumBtn.classList.remove("locked");tsDenBtn.classList.remove("locked")}}
function updateTSDisplay(){var n=state.beatsPerMeasure;var d=state.tsDenominator;tsNumBtn.innerHTML=(n<10?"<span class='lz'>0</span>":"<span class='lz visible'>"+Math.floor(n/10)+"</span>")+n%10;tsDenBtn.innerHTML=d+(d<10?"<span class='lz'>0</span>":"")}
function changeNum(delta){if(state.playing)return;var n=state.beatsPerMeasure+delta;if(isMobile){if(n<1)n=16;if(n>16)n=1}else{if(n<1)n=1;if(n>16)n=16}state.beatsPerMeasure=n;while(state.accentPattern.length<n)state.accentPattern.push(0);state.accentPattern.length=n;beatInterval=calcBeatInterval();updateTSDisplay();renderAccentDots()}
function changeDen(delta){if(state.playing)return;var idx=DEN_VALUES.indexOf(state.tsDenominator);if(idx===-1)idx=1;idx+=delta;if(isMobile){if(idx<0)idx=DEN_VALUES.length-1;if(idx>=DEN_VALUES.length)idx=0}else{if(idx<0)idx=0;if(idx>=DEN_VALUES.length)idx=DEN_VALUES.length-1}state.tsDenominator=DEN_VALUES[idx];beatInterval=calcBeatInterval();updateTSDisplay()}
tsNumBtn.addEventListener("wheel",function(e){if(isMobile)return;e.preventDefault();changeNum(e.deltaY>0?-1:1)},{passive:false});
tsDenBtn.addEventListener("wheel",function(e){if(isMobile)return;e.preventDefault();changeDen(e.deltaY>0?-1:1)},{passive:false});




// ===== BPM DRAG =====
var bpmDragY=0,bpmDragStart=0,bpmDragging=false;
bpmValue.addEventListener("mousedown",function(e){
  bpmDragY=e.clientY;bpmDragStart=state.bpm;bpmDragging=true;e.preventDefault();
});
bpmValue.addEventListener("touchstart",function(e){
  bpmDragY=e.touches[0].clientY;bpmDragStart=state.bpm;bpmDragging=true;
},{passive:false});
window.addEventListener("mousemove",function(e){
  if(!bpmDragging)return;
  if(state.playing)return;
  var rawDelta=bpmDragY-e.clientY;var delta=Math.round(rawDelta*0.5);var ty=Math.max(-8,Math.min(8,-rawDelta*0.3));bpmValue.style.transform="translateY("+ty+"px)";
  state.bpm=Math.max(20,Math.min(300,bpmDragStart+delta));
  bpmValue.textContent=state.bpm;beatInterval=calcBeatInterval();
  if(state.playing){var now=audioCtx?audioCtx.currentTime:performance.now()/1000;state.firstBeatTime=now+.05;nextBeatTime=state.firstBeatTime;scheduleBeatIndex=0}
});
window.addEventListener("touchmove",function(e){
  if(!bpmDragging)return;
  if(state.playing)return;
    var rawDelta=bpmDragY-e.touches[0].clientY;var delta=Math.round(rawDelta*0.5);var ty=Math.max(-8,Math.min(8,-rawDelta*0.3));bpmValue.style.transform="translateY("+ty+"px)";
  state.bpm=Math.max(20,Math.min(300,bpmDragStart+delta));
  bpmValue.textContent=state.bpm;beatInterval=calcBeatInterval();
  if(state.playing){var now=audioCtx?audioCtx.currentTime:performance.now()/1000;state.firstBeatTime=now+.05;nextBeatTime=state.firstBeatTime;scheduleBeatIndex=0}
});
window.addEventListener("mouseup",function(){if(bpmDragging){bpmDragging=false;bpmValue.classList.remove("bpm-dragging");bpmValue.style.transform="";bpmValue.textContent=state.bpm}});
window.addEventListener("touchend",function(){if(bpmDragging){var didDrag=Math.abs(state.bpm-bpmDragStart)>3;bpmDragging=false;bpmValue.classList.remove("bpm-dragging");bpmValue.style.transform="";bpmValue.textContent=state.bpm;if(!didDrag){if(state.playing)stopPlayback();else{state.angle=state.swingDirection*.01;startPlayback()}}}});

// ===== BPM CLICK =====
bpmValue.addEventListener("click",function(e){if(bpmDragging||Math.abs(state.bpm-bpmDragStart)>3)return;if(state.playing)stopPlayback();else{state.angle=state.swingDirection*.01;startPlayback()}});

// ===== WHEEL =====
function onWheel(e){if(state.playing)return;
  e.preventDefault();var delta=e.deltaY>0?-1:1;
  state.bpm=Math.max(20, Math.min(300,state.bpm+delta));
  bpmValue.textContent=state.bpm;beatInterval=calcBeatInterval();
  if(state.playing){var now=audioCtx?audioCtx.currentTime:performance.now()/1000;state.firstBeatTime=now+.05;nextBeatTime=state.firstBeatTime;scheduleBeatIndex=0}
}
bpmValue.addEventListener("wheel",onWheel,{passive:false});
canvas.addEventListener("wheel",onWheel,{passive:false});

// ===== EVENTS =====
titleEl.addEventListener("click",function(e){if(e.target===themeBtn||themeBtn.contains(e.target))return;if(state.playing)return;state.swingDirection=state.swingDirection*-1;titleEl.classList.toggle("dir-right",state.swingDirection===1)});
canvas.addEventListener("mousedown",onPointerDown);canvas.addEventListener("mousemove",onPointerMove);window.addEventListener("mouseup",onPointerUp);
canvas.addEventListener("touchstart",onPointerDown,{passive:false});canvas.addEventListener("touchmove",onPointerMove,{passive:false});window.addEventListener("touchend",onPointerUp);
window.addEventListener("keydown",function(e){if(e.code==="Space"&&e.target===document.body){e.preventDefault();if(state.playing)stopPlayback();else{state.angle=.01;startPlayback()}}});

themeBtn.addEventListener("click",function(){state.theme=state.theme==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",state.theme);themeBtn.innerHTML=state.theme==="dark"?"":"";localStorage.setItem("oscilla-theme",state.theme)});

// ===== OBSERVER =====
function beatObserver(){
  if(state.playing){
    var now=audioCtx?audioCtx.currentTime:performance.now()/1000;
    var phase=(now-state.firstBeatTime)/beatInterval;
    var rawBeat=Math.floor(phase-0.5);var cur=rawBeat<0?-1:rawBeat%state.beatsPerMeasure;
    if(rawBeat!==state.lastRawBeat){state.lastRawBeat=rawBeat;state.lastFlashBeat=cur;state.beatFlash=1;state.lastBeatTime=performance.now()/1000;if(cur>=0)state.currentBeat=cur;highlightCurrentBeat()}
  }else{state.lastFlashBeat=-1}
  requestAnimationFrame(beatObserver);
}

// ===== INIT =====
function init(){
  var saved=localStorage.getItem("oscilla-theme");
  if(saved){state.theme=saved;document.documentElement.setAttribute("data-theme",state.theme);themeBtn.innerHTML=state.theme==="dark"?"":""}resizeCanvas();beatInterval=calcBeatInterval();renderAccentDots();updateTSDisplay();
  animRAF=requestAnimationFrame(drawPendulum);requestAnimationFrame(beatObserver);
}
window.addEventListener("resize",resizeCanvas);init();
})();

</script>
